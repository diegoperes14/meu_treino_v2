<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Diário de treino pessoal">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<title>Meu Treino</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#111827;--success:#198754}
body{background:var(--bg);color:var(--text);padding-bottom:88px}
body.dark{--bg:#0f172a;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--accent:#f8fafc}
body.dark .card,body.dark .modal-content,body.dark .list-group-item,body.dark .accordion-item{background:var(--card);color:var(--text);border-color:var(--border)}
body.dark .text-muted,body.dark .form-text{color:var(--muted)!important}
body.dark .form-control,body.dark .form-select{background:#0b1220;color:#f8fafc;border-color:#475569}
body.dark .btn-outline-dark{color:#f8fafc;border-color:#64748b}
body.dark .btn-close{filter:invert(1)}
.app-header{position:sticky;top:0;z-index:1030;background:var(--card);border-bottom:1px solid var(--border)}
.group-nav{overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.group-nav::-webkit-scrollbar{display:none}
.group-btn{min-width:105px}
.card{background:var(--card);border-color:var(--border)}
.exercise-card{border:0;border-radius:20px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.07)}
.exercise-card.done{border:2px solid #198754}
.exercise-img{width:100%;height:180px;object-fit:cover;background:#e5e7eb}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:1020;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{border:0;background:transparent;color:var(--text)}
.small-muted{font-size:.82rem;color:var(--muted)}
.metric{font-size:1.5rem;font-weight:800}
.series-row{display:grid;grid-template-columns:45px 1fr 1fr 44px;gap:6px;align-items:center;margin-bottom:8px}
.series-label{font-weight:700;text-align:center}
.timer{font-variant-numeric:tabular-nums;font-size:2.6rem;font-weight:800}
.sticky-mobile{position:sticky;top:92px;z-index:10}
.checkout-card-preview{position:relative;width:100%;max-width:360px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#0b0f14;box-shadow:0 16px 36px rgba(0,0,0,.28)}
.checkout-card-preview.feed{aspect-ratio:4/5}
.checkout-card-photo{position:absolute;inset:0;background-size:cover;background-position:center}
.checkout-card-overlay{display:none}
.checkout-card-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:18px}
.checkout-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.46);backdrop-filter:blur(2px);font-size:.74rem;font-weight:700;letter-spacing:.04em}
.checkout-badge-dot{width:9px;height:9px;border-radius:50%;background:#b8ff2c}
.checkout-title{font-size:1.15rem;font-weight:800;line-height:1.2}
.checkout-subtitle{font-size:.78rem;opacity:.88}
.checkout-session{font-size:.82rem;font-weight:700;letter-spacing:.03em}
.checkout-card-info{margin-top:auto;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(8,12,18,.82)}
.checkout-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.checkout-stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 9px}
.checkout-stat .value{font-size:.95rem;font-weight:800;line-height:1.1}
.checkout-stat .label{font-size:.7rem;opacity:.78}
.checkout-brand{font-size:.72rem;opacity:.9}
.checkout-template-btn.active,.checkout-format-btn.active{border-color:#198754!important;background:#198754!important;color:#fff!important}
@media(max-width:576px){
  .exercise-img{height:160px}
  .series-row{grid-template-columns:38px 1fr 1fr 40px}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="container py-2">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <div class="fw-bold">🏋️ Meu Treino</div>
        <div id="dateLabel" class="small-muted"></div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" onclick="openSearchExercise()">🔎</button>
        <button class="btn btn-sm btn-dark" onclick="openSettings()">⚙️</button>
      </div>
    </div>
    <div id="dayNav" class="group-nav d-flex gap-2 py-2"></div>
  </div>
</header>

<main class="container py-3">
  <div id="app"></div>
</main>

<nav class="bottom-nav">
  <div class="container">
    <div class="d-flex justify-content-around py-2">
      <button onclick="showToday()">🏠<div class="small">Hoje</div></button>
      <button onclick="showExercises()">🏋️<div class="small">Exercícios</div></button>
      <button onclick="showHistory()">📊<div class="small">Evolução</div></button>
      <button onclick="showSettingsPage()">⚙️<div class="small">Configurar</div></button>
    </div>
  </div>
</nav>

<div class="modal fade" id="exerciseModal" tabindex="-1">
<div class="modal-dialog modal-lg"><form class="modal-content" id="exerciseForm">
<div class="modal-header"><h5 class="modal-title" id="exerciseTitle">Exercício</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<input type="hidden" id="exerciseId"><input type="hidden" id="exerciseOriginalDay">
<div class="row">
<div class="col-md-7">
<div class="mb-3"><label class="form-label">Nome</label><input id="exerciseName" class="form-control" required></div>
<div class="mb-3"><label class="form-label">URL da imagem</label><input id="exerciseImage" type="url" class="form-control" placeholder="https://..."></div>
</div>
<div class="col-md-5">
<div class="mb-3"><label class="form-label">Dia da semana</label><select id="exerciseDaySelect" class="form-select"></select></div>
<div class="mb-3"><label class="form-label">Grupo muscular</label><select id="exerciseGroupSelect" class="form-select"></select></div>
<div class="row">
<div class="col-4"><label class="form-label">Séries</label><input id="exerciseSets" type="number" min="1" class="form-control" value="3"></div>
<div class="col-4"><label class="form-label">Reps</label><input id="exerciseReps" type="number" min="1" class="form-control" value="10"></div>
<div class="col-4"><label class="form-label">Carga</label><input id="exerciseWeight" type="number" min="0" step="0.5" class="form-control" value="0"></div>
</div>
</div></div>
</div>
<div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-dark">Salvar</button></div>
</form></div></div>

<div class="modal fade" id="timerModal" tabindex="-1">
<div class="modal-dialog modal-sm modal-dialog-centered"><div class="modal-content text-center">
<div class="modal-header"><h5 class="modal-title">Descanso</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><div id="timerDisplay" class="timer">01:30</div><div class="d-flex justify-content-center gap-2 mt-3"><button class="btn btn-outline-secondary" onclick="adjustTimer(-15)">−15s</button><button class="btn btn-dark" id="timerToggle" onclick="toggleTimer()">Iniciar</button><button class="btn btn-outline-secondary" onclick="adjustTimer(15)">+15s</button></div><button class="btn btn-link mt-3" onclick="stopTimer()">Parar</button></div>
</div></div></div>

<div class="modal fade" id="settingsModal" tabindex="-1">
<div class="modal-dialog modal-lg"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title">Configurações e backup</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<ul class="nav nav-pills mb-3"><li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#settingsGeneral">Geral</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#settingsBackup">Backup</button></li></ul>
<div class="tab-content">
<div class="tab-pane fade show active" id="settingsGeneral">
<div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="darkModeSwitch" onchange="toggleTheme(this.checked)"><label class="form-check-label" for="darkModeSwitch">Modo escuro</label></div>
<div class="mb-3"><label class="form-label">Descanso padrão (segundos)</label><input id="restDefault" type="number" min="0" class="form-control" value="90"></div>
<div class="mb-3"><label class="form-label">Nome para cartão de treino</label><input id="profileNameInput" class="form-control" maxlength="42" placeholder="Ex.: Diego"></div>
<div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="hideNameSwitch"><label class="form-check-label" for="hideNameSwitch">Ocultar nome por padrão no compartilhamento</label></div>
<p class="text-muted mb-0">As categorias agora seguem os dias da semana.</p>
</div>
<div class="tab-pane fade" id="settingsBackup">
<div class="d-grid gap-2">
<button class="btn btn-dark" onclick="exportFull()">⬇️ Exportar tudo (JSON)</button>
<button class="btn btn-outline-dark" onclick="exportHistory()">⬇️ Exportar somente histórico</button>
<button class="btn btn-outline-dark" onclick="exportExercises()">⬇️ Exportar exercícios</button>
<button class="btn btn-outline-primary" onclick="triggerImport()">⬆️ Importar backup</button>
<input id="importInput" type="file" accept=".json" class="d-none" onchange="importBackup(event)">
<button class="btn btn-outline-danger" onclick="resetAll()">🗑️ Apagar tudo</button>
</div>
</div></div></div></div></div></div>

<div class="modal fade" id="searchModal" tabindex="-1">
<div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Banco de exercícios</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<input id="searchInput" class="form-control mb-3" placeholder="Ex.: supino, agachamento..." oninput="renderCatalog()">
<div id="catalogList"></div>
</div></div></div></div>
 
<div class="modal fade" id="checkoutModal" tabindex="-1">
<div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title">Checkout do treino</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
 <div class="text-center mb-3"><div class="fw-bold fs-5">🎉 Treino concluído!</div><div class="small-muted">Adicione uma foto para registrar o seu resultado.</div></div>
 <input id="checkoutPhotoInput" type="file" accept="image/*" class="d-none" onchange="handleCheckoutPhoto(this.files && this.files[0])">
 <div class="d-grid gap-2 mb-3">
  <button class="btn btn-dark" type="button" onclick="openCheckoutFilePicker('camera')">📸 Tirar foto do check</button>
  <button class="btn btn-outline-dark" type="button" onclick="openCheckoutFilePicker('gallery')">🖼️ Escolher da galeria</button>
 </div>
 <div class="d-flex flex-wrap gap-2 mb-3">
  <button id="checkoutTemplateNeon" class="btn btn-sm btn-outline-success checkout-template-btn active" type="button" onclick="setCheckoutTemplate('neon')">Template Neon</button>
  <button id="checkoutTemplateGraphite" class="btn btn-sm btn-outline-secondary checkout-template-btn" type="button" onclick="setCheckoutTemplate('graphite')">Template Grafite</button>
  <button id="checkoutFormatStory" class="btn btn-sm btn-outline-dark checkout-format-btn active" type="button" onclick="setCheckoutFormat('story')">9:16 Story</button>
  <button id="checkoutFormatFeed" class="btn btn-sm btn-outline-dark checkout-format-btn" type="button" onclick="setCheckoutFormat('feed')">4:5 Feed</button>
 </div>
 <div id="checkoutPreviewWrap" class="mt-3 d-none">
  <div class="d-flex justify-content-center">
   <div id="checkoutCardPreview" class="checkout-card-preview">
    <div id="checkoutCardPhoto" class="checkout-card-photo"></div>
    <div id="checkoutCardOverlay" class="checkout-card-overlay"></div>
    <div class="checkout-card-content text-white">
     <div>
      <div class="checkout-badge"><span class="checkout-badge-dot"></span> TREINO CONCLUÍDO</div>
      <div id="checkoutPreviewDate" class="checkout-subtitle mt-2"></div>
     </div>
     <div id="checkoutCardInfoPanel" class="checkout-card-info">
      <div id="checkoutPreviewName" class="checkout-title"></div>
      <div id="checkoutPreviewWorkout" class="checkout-session mt-1"></div>
      <div id="checkoutPreviewStats" class="checkout-stats mt-2"></div>
      <div id="checkoutPreviewMotivation" class="checkout-subtitle mt-2">Consistência vence.</div>
      <div class="checkout-brand mt-2">by Diego Lima</div>
     </div>
    </div>
   </div>
  </div>
  <div class="d-grid mt-3">
   <button class="btn btn-outline-secondary" type="button" onclick="redoCheckoutPhoto()">🔁 Refazer foto</button>
  </div>
 </div>
 <div class="form-check mt-3">
  <input class="form-check-input" type="checkbox" id="checkoutHideName">
  <label class="form-check-label" for="checkoutHideName">Ocultar nome no cartão</label>
 </div>
</div>
<div class="modal-footer justify-content-between">
 <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar / Voltar</button>
 <div class="d-flex gap-2">
  <button id="shareCheckoutBtn" type="button" class="btn btn-dark d-none" onclick="shareCheckoutImage()">📤 Compartilhar</button>
  <button id="saveCheckoutBtn" type="button" class="btn btn-success d-none" onclick="saveCheckoutImage()">💾 Salvar foto</button>
 </div>
</div>
</div></div></div>
 
<div class="toast-container position-fixed top-0 end-0 p-3"><div id="toast" class="toast"><div class="toast-body"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const DAYS = {
domingo: { label: 'Domingo', icon: '☀️' },
segunda: { label: 'Segunda', icon: '1' },
terca: { label: 'Terça', icon: '2' },
quarta: { label: 'Quarta', icon: '3' },
quinta: { label: 'Quinta', icon: '4' },
sexta: { label: 'Sexta', icon: '5' },
sabado: { label: 'Sábado', icon: '6' }
};
const DAY_ORDER = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
const MUSCLE_GROUPS = {
costas: { label: 'Costas', icon: '🦍' },
pernas: { label: 'Pernas', icon: '🦵' },
bracos: { label: 'Braços', icon: '💪' },
peito: { label: 'Peito', icon: '🏋️' },
abdomen: { label: 'Abdômen', icon: '🔥' },
ombros: { label: 'Ombros', icon: '🎯' }
};
const DEFAULT_CATALOG = [
['Supino reto', 'peito'], ['Supino inclinado', 'peito'], ['Crucifixo', 'peito'], ['Crossover', 'peito'],
['Puxada frontal', 'costas'], ['Remada baixa', 'costas'], ['Remada curvada', 'costas'], ['Remada unilateral', 'costas'],
['Agachamento livre', 'pernas'], ['Leg press', 'pernas'], ['Cadeira extensora', 'pernas'], ['Mesa flexora', 'pernas'],
['Rosca direta', 'bracos'], ['Rosca martelo', 'bracos'], ['Tríceps pulley', 'bracos'], ['Tríceps francês', 'bracos'],
['Abdominal supra', 'abdomen'], ['Elevação de pernas', 'abdomen'], ['Prancha', 'abdomen'],
['Desenvolvimento', 'ombros'], ['Elevação lateral', 'ombros'], ['Elevação frontal', 'ombros']
].map(([name, group]) => ({ name, group, image: '' }));

const KEY = 'meuTreino_v3';
const CHECKOUT_TEMPLATES = {
 neon: { accent: '#b8ff2c', panel: 'rgba(6, 12, 18, 0.86)', chip: 'rgba(0,0,0,0.46)' },
 graphite: { accent: '#22c55e', panel: 'rgba(12, 14, 18, 0.9)', chip: 'rgba(0,0,0,0.46)' }
};
const CHECKOUT_MOTIVATION = ['Consistência vence.', 'Mais um passo concluído.', 'Disciplina em alta.'];
let charts = [];
let timerSeconds = 90;
let timerRunning = false;
let timerHandle = null;
let state = loadState();
let page = 'today';
let currentDay = isDayKey(state.settings.lastDay) ? state.settings.lastDay : dayFromDate(new Date());
let checkoutDraft = {
 day: currentDay,
 date: todayKey(),
 sourceUrl: '',
 template: 'neon',
 format: 'story',
 hideName: !!state.settings.hideNameOnShare,
 busy: false
};

function dayFromDate(date = new Date()) {
return DAY_ORDER[date.getDay()];
}
function isDayKey(value) {
return DAY_ORDER.includes(value);
}
function freshState() {
return {
 version: 4,
 exercises: Object.fromEntries(DAY_ORDER.map(day => [day, []])),
 workouts: {},
 sessionMeta: {},
 settings: { lastDay: dayFromDate(new Date()), dark: false, restDefault: 90, profileName: '', hideNameOnShare: false }
};
}
function normalizeState(parsed) {
 const base = freshState();
 const loaded = {
  ...base,
  ...parsed,
  exercises: Object.fromEntries(DAY_ORDER.map(day => [day, []])),
  workouts: {},
  sessionMeta: parsed.sessionMeta || {},
  settings: { ...base.settings, ...(parsed.settings || {}) }
 };
 const oldExercises = parsed.exercises || {};
 const looksLikeDays = Object.keys(oldExercises).some(isDayKey);
 if (looksLikeDays) {
  DAY_ORDER.forEach(day => {
   loaded.exercises[day] = Array.isArray(oldExercises[day]) ? oldExercises[day] : [];
  });
 } else {
  const schedule = parsed.schedule || {};
  const used = new Set();
  DAY_ORDER.forEach(day => {
   const groups = schedule[day] || [];
   const bucket = [];
   groups.forEach(group => {
    if (Array.isArray(oldExercises[group])) {
     bucket.push(...oldExercises[group]);
     used.add(group);
    }
   });
   loaded.exercises[day] = bucket;
  });
  const leftovers = Object.entries(oldExercises)
   .filter(([group]) => !isDayKey(group) && !used.has(group))
   .flatMap(([, arr]) => Array.isArray(arr) ? arr : []);
  if (leftovers.length) {
   loaded.exercises[loaded.settings.lastDay] = [...loaded.exercises[loaded.settings.lastDay], ...leftovers];
  }
 }
 const exerciseDayById = {};
 DAY_ORDER.forEach(day => (loaded.exercises[day] || []).forEach(exercise => {
  exerciseDayById[exercise.id] = day;
 }));
 Object.entries(parsed.workouts || {}).forEach(([date, dayBuckets]) => {
  loaded.workouts[date] = loaded.workouts[date] || {};
  Object.entries(dayBuckets || {}).forEach(([bucketKey, records]) => {
   const targetDay = isDayKey(bucketKey) ? bucketKey : null;
   Object.entries(records || {}).forEach(([exerciseId, record]) => {
    const day = targetDay || exerciseDayById[exerciseId] || loaded.settings.lastDay;
    loaded.workouts[date][day] = loaded.workouts[date][day] || {};
    loaded.workouts[date][day][exerciseId] = record;
   });
  });
 });
 if (!isDayKey(loaded.settings.lastDay)) loaded.settings.lastDay = dayFromDate(new Date());
 return loaded;
}
function loadState() {
try {
 const raw = localStorage.getItem(KEY);
 if (!raw) return freshState();
 const parsed = JSON.parse(raw);
 return normalizeState(parsed);
} catch (error) {
 return freshState();
}
}
function save() {
localStorage.setItem(KEY, JSON.stringify(state));
}
function uid() {
return crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + Math.random();
}
function todayKey() {
return new Date().toLocaleDateString('en-CA');
}
function fmtDate(key) {
return new Date(key + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
}
function esc(value) {
return String(value ?? '').replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[match]));
}
function imageUrl(url, text) {
return url || `https://placehold.co/800x500?text=${encodeURIComponent(text || 'Exercício')}`;
}
function ensureDay(day) {
if (!state.exercises[day]) state.exercises[day] = [];
}
function getWorkout(date = todayKey()) {
if (!state.workouts[date]) state.workouts[date] = {};
return state.workouts[date];
}
function getRecord(date, day, id) {
const workout = getWorkout(date);
if (!workout[day]) workout[day] = {};
if (!workout[day][id]) workout[day][id] = { series: [], done: false };
return workout[day][id];
}
function getSessionMeta(date, day, create = true) {
 if (!state.sessionMeta || typeof state.sessionMeta !== 'object') state.sessionMeta = {};
 if (!state.sessionMeta[date]) {
  if (!create) return null;
  state.sessionMeta[date] = {};
 }
 if (!state.sessionMeta[date][day] && create) state.sessionMeta[date][day] = {};
 return state.sessionMeta[date][day] || null;
}
function markSessionStarted(day, date = todayKey()) {
 const meta = getSessionMeta(date, day, true);
 if (!meta.startedAt) meta.startedAt = new Date().toISOString();
}
function hasCompletedWorkoutOnDay(date, day) {
 const meta = getSessionMeta(date, day, false);
 if (meta?.completedAt) return true;
 const records = state.workouts?.[date]?.[day] || {};
 return Object.values(records).some(record => {
  if (!record || typeof record !== 'object') return false;
  if (record.done) return true;
  return (record.series || []).some(item => item?.done);
 });
}
function updateSessionCompletion(day, date = todayKey()) {
 const meta = getSessionMeta(date, day, true);
 if (areAllExercisesDoneForDay(day)) {
  if (!meta.completedAt) meta.completedAt = new Date().toISOString();
 } else if (meta.completedAt) {
  delete meta.completedAt;
 }
}
function getWorkoutSequence(date = todayKey(), day = currentDay) {
 if (!hasCompletedWorkoutOnDay(date, day)) return null;
 const sessions = [];
 Object.keys(state.workouts || {}).sort().forEach(key => {
  DAY_ORDER.forEach(dayKey => {
   if (!hasCompletedWorkoutOnDay(key, dayKey)) return;
   const meta = getSessionMeta(key, dayKey, false) || {};
   const stamp = meta.completedAt || meta.startedAt || `${key}T12:00:00`;
   sessions.push({ key, day: dayKey, stamp: new Date(stamp).getTime() || Number.MAX_SAFE_INTEGER });
  });
 });
 sessions.sort((a, b) => a.stamp - b.stamp);
 const index = sessions.findIndex(item => item.key === date && item.day === day);
 return index >= 0 ? index + 1 : null;
}
function findExerciseById(id) {
for (const day of DAY_ORDER) {
 const exercise = (state.exercises[day] || []).find(item => item.id === id);
 if (exercise) return { day, exercise };
}
return null;
}
function renderHeader() {
document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });

function updateSeries(day, id, index, field, value) {
markSessionStarted(day);
const record = getRecord(todayKey(), day, id);
const exercise = (state.exercises[day] || []).find(item => item.id === id);
if (!record.series[index]) record.series[index] = {};
record.series[index][field] = Number(value) || 0;
if (exercise && field === 'weight') {
 exercise.weight = Number(value) || 0;
}
updateSessionCompletion(day);
save();
page === 'today' ? renderToday() : renderExercises();
}
function isExerciseCompleted(day, id) {
const exercise = (state.exercises[day] || []).find(item => item.id === id);
const record = getRecord(todayKey(), day, id);
const total = Number(exercise?.sets || record.series.length || 0);
if (!total) return false;
return Array.from({ length: total }, (_, index) => !!record.series[index]?.done).every(Boolean);
}
function areAllExercisesDoneForDay(day) {
const allExercises = state.exercises[day] || [];
return allExercises.length > 0 && allExercises.every(item => isExerciseCompleted(day, item.id));
}
function toggleSeries(day, id, index) {
markSessionStarted(day);
const record = getRecord(todayKey(), day, id);
const exercise = (state.exercises[day] || []).find(item => item.id === id);
const total = Number(exercise?.sets || 3);
if (!record.series[index]) record.series[index] = {};
const previousExerciseDone = isExerciseCompleted(day, id);
record.series[index].done = !record.series[index].done;
record.done = Array.from({ length: total }, (_, seriesIndex) => !!record.series[seriesIndex]?.done).every(Boolean);
record.updatedAt = new Date().toISOString();
updateSessionCompletion(day);
save();
page === 'today' ? renderToday() : renderExercises();
if (record.series[index].done) openTimer();
if (!previousExerciseDone && record.done && areAllExercisesDoneForDay(day)) openCheckoutModal(day);
}
function toggleExerciseDone(day, id) {
markSessionStarted(day);
const record = getRecord(todayKey(), day, id);
const exercise = (state.exercises[day] || []).find(item => item.id === id);
const total = Number(exercise?.sets || 3);
const previousExerciseDone = isExerciseCompleted(day, id);
record.series = Array.from({ length: total }, (_, index) => ({ ...record.series[index], done: !record.done }));
record.done = !record.done;
record.updatedAt = new Date().toISOString();
updateSessionCompletion(day);
save();
page === 'today' ? renderToday() : renderExercises();
if (!previousExerciseDone && record.done && areAllExercisesDoneForDay(day)) openCheckoutModal(day);
}

function formatDuration(minutes) {
 if (!Number.isFinite(minutes) || minutes <= 0) return null;
 if (minutes < 60) return `${minutes} min`;
 const h = Math.floor(minutes / 60);
 const m = minutes % 60;
 return m ? `${h}h ${m}m` : `${h}h`;
}
function getCheckoutSummary(day = checkoutDraft.day, date = checkoutDraft.date) {
 const completedAt = getSessionMeta(date, day, false)?.completedAt || new Date().toISOString();
 const startedAt = getSessionMeta(date, day, false)?.startedAt;
 const records = state.workouts?.[date]?.[day] || {};
 const doneExercises = (state.exercises[day] || []).filter(exercise => {
  const record = records[exercise.id];
  if (!record) return false;
  if (record.done) return true;
  return (record.series || []).some(item => item?.done);
 });
 const groups = [...new Set(doneExercises.map(item => (MUSCLE_GROUPS[item.group]?.label || item.group || '').toUpperCase()).filter(Boolean))];
 const sequence = getWorkoutSequence(date, day);
 const durationMinutes = startedAt ? Math.max(1, Math.round((new Date(completedAt).getTime() - new Date(startedAt).getTime()) / 60000)) : null;
 const stats = [];
 const formattedDuration = formatDuration(durationMinutes);
 if (formattedDuration) stats.push({ label: 'Duração', value: formattedDuration });
 if (doneExercises.length) stats.push({ label: 'Exercícios', value: String(doneExercises.length) });
 if (sequence) stats.push({ label: 'Treino #', value: String(sequence) });
 return {
  dateTime: new Date(completedAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }),
  workoutLabel: groups.join(' + ') || DAYS[day]?.label?.toUpperCase() || 'TREINO',
  athleteName: state.settings.profileName?.trim() || '',
  hideName: checkoutDraft.hideName,
  stats: stats.slice(0, 3),
  motivation: CHECKOUT_MOTIVATION[sequence ? sequence % CHECKOUT_MOTIVATION.length : 0]
 };
}

function loadImage(src) {
 return new Promise((resolve, reject) => {
  const image = new Image();
  image.onload = () => resolve(image);
  image.onerror = reject;
  image.src = src;
 });
}
function drawImageCover(ctx, image, x, y, width, height) {
 const scale = Math.max(width / image.width, height / image.height);
 const drawWidth = image.width * scale;
 const drawHeight = image.height * scale;
 const dx = x + (width - drawWidth) / 2;
 const dy = y + (height - drawHeight) / 2;
 ctx.drawImage(image, dx, dy, drawWidth, drawHeight);
}
async function buildCheckoutImageBlob() {
 if (!checkoutDraft.sourceUrl) return null;
 const isStory = checkoutDraft.format === 'story';
 const width = 1080;
 const height = isStory ? 1920 : 1350;
 const safeX = 72;
 const safeBottom = 68;
 const panelTop = Math.round(height * 0.64);
 const summary = getCheckoutSummary();
 const template = CHECKOUT_TEMPLATES[checkoutDraft.template] || CHECKOUT_TEMPLATES.neon;
 const canvas = document.createElement('canvas');
 canvas.width = width;
 canvas.height = height;
 const ctx = canvas.getContext('2d');
 ctx.fillStyle = '#0b1118';
 ctx.fillRect(0, 0, width, height);
 try {
  const image = await loadImage(checkoutDraft.sourceUrl);
  drawImageCover(ctx, image, 0, 0, width, height);
 } catch (error) {
  return null;
 }
 ctx.fillStyle = template.panel;
 ctx.fillRect(38, panelTop, width - 76, height - panelTop - 36);
 ctx.strokeStyle = 'rgba(255,255,255,0.16)';
 ctx.lineWidth = 2;
 roundRect(ctx, 38, panelTop, width - 76, height - panelTop - 36, 24, false, true);
 ctx.fillStyle = template.chip;
 roundRect(ctx, safeX, 48, 520, 54, 27, true, false);
 ctx.fillStyle = template.accent;
 ctx.beginPath();
 ctx.arc(safeX + 24, 76, 10, 0, Math.PI * 2);
 ctx.fill();
 ctx.fillStyle = '#ffffff';
 ctx.font = '700 30px sans-serif';
 ctx.fillText('TREINO CONCLUÍDO', safeX + 48, 86);
 ctx.font = '600 28px sans-serif';
 ctx.fillText(summary.dateTime, safeX, 146);
 ctx.fillStyle = '#9ca3af';
 ctx.font = '600 24px sans-serif';
 ctx.textAlign = 'right';
 ctx.fillText('Meu Treino', width - safeX, 86);
 ctx.textAlign = 'left';
 const footerY = panelTop + 88;
 ctx.fillStyle = '#ffffff';
 ctx.font = '800 52px sans-serif';
 ctx.fillText(summary.hideName ? 'Atleta' : (summary.athleteName || 'Atleta'), safeX, footerY);
 ctx.font = '700 32px sans-serif';
 wrapText(ctx, summary.workoutLabel, safeX, footerY + 50, width - safeX * 2, 40, 2);
 const stats = summary.stats.length ? summary.stats : [{ label: 'Status', value: 'Concluído' }];
 const boxY = footerY + 130;
 const gap = 16;
 const boxWidth = (width - safeX * 2 - gap * 2) / 3;
 const row = stats.length >= 3 ? stats.slice(0, 3) : [...stats, ...Array.from({ length: 3 - stats.length }, () => ({ label: '', value: '' }))];
 row.forEach((item, index) => {
  const x = safeX + index * (boxWidth + gap);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 2;
  roundRect(ctx, x, boxY, boxWidth, 112, 16, true, true);
  if (!item.value) return;
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 31px sans-serif';
  ctx.fillText(item.value, x + 15, boxY + 50);
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '600 22px sans-serif';
  ctx.fillText(item.label, x + 15, boxY + 83);
 });
 ctx.fillStyle = template.accent;
 ctx.font = '600 24px sans-serif';
 ctx.fillText(summary.motivation, safeX, height - safeBottom);
 return await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
}

 setCheckoutBusy(true, 'Gerando');
 const blob = await buildCheckoutImageBlob();
 if (!blob) {
  setCheckoutBusy(false);
  toast('Não foi possível gerar a imagem final.');
  return;
 }
 const file = new File([blob], `checkout-treino-${todayKey()}.jpg`, { type: 'image/jpeg' });
 try {
  if (navigator.share && navigator.canShare?.({ files: [file] })) {
   await navigator.share({ files: [file], title: 'Treino concluído', text: 'Meu check de treino 💪' });
   toast('Imagem pronta e compartilhada.');
  } else {
   downloadBlob(blob);
   toast('Seu navegador não suporta compartilhamento direto. A imagem foi baixada.');
  }
 } catch (error) {
  if (error?.name === 'AbortError') toast('Compartilhamento cancelado.');
  else toast('Não foi possível compartilhar a imagem.');
 } finally {
  setCheckoutBusy(false);
 }
}
async function saveCheckoutImage() {
 if (!checkoutDraft.sourceUrl) {
  toast('Selecione uma foto antes de salvar.');
  return;
 }
 setCheckoutBusy(true, 'Gerando');
 const blob = await buildCheckoutImageBlob();
 if (!blob) {
  setCheckoutBusy(false);
  toast('Não foi possível gerar a imagem final.');
  return;
 }
 downloadBlob(blob);
 setCheckoutBusy(false);
 toast('Imagem salva no dispositivo.');
}
function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
 const r = Math.min(radius, width / 2, height / 2);
 ctx.beginPath();
 ctx.moveTo(x + r, y);
 ctx.arcTo(x + width, y, x + width, y + height, r);
 ctx.arcTo(x + width, y + height, x, y + height, r);
 ctx.arcTo(x, y + height, x, y, r);
 ctx.arcTo(x, y, x + width, y, r);
 ctx.closePath();
 if (fill) ctx.fill();
 if (stroke) ctx.stroke();
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
const words = text.split(' ');
const lines = [];
let current = '';
for (const word of words) {
  const trial = current ? `${current} ${word}` : word;
  if (ctx.measureText(trial).width > maxWidth && current) {
    lines.push(current);
    current = word;
  } else {
    current = trial;
  }
}
if (current) lines.push(current);
for (let i = 0; i < Math.min(lines.length, maxLines); i++) {
  ctx.fillText(lines[i], x, y + i * lineHeight);
}
}
function allExerciseOptions() {
const all = [];
DAY_ORDER.forEach(day => (state.exercises[day] || []).forEach(exercise => all.push({ day, exercise })));
return all.map(item => `<option value="${esc(item.exercise.id)}">${DAYS[item.day].label} — ${esc(item.exercise.name)}</option>`).join('');
}
function renderSession(date) {
let rows = '';
Object.entries(state.workouts[date] || {}).forEach(([day, records]) => {
 Object.entries(records).forEach(([id, record]) => {
  if (!record.done) return;
  const found = findExerciseById(id);
  const exercise = found?.exercise;
  rows += `<li class="list-group-item d-flex justify-content-between"><span>${DAYS[day]?.icon || ''} ${esc(exercise?.name || 'Exercício')}</span><span>${record.series.filter(series => series.done).length} séries</span></li>`;
 });
});
return rows ? `<div class="mb-3"><h6 class="mb-2">${fmtDate(date)}</h6><ul class="list-group">${rows}</ul></div>` : '';
}
function calculateStats() {
let workouts = 0;
let series = 0;
let volume = 0;
const maxByExercise = {};
Object.entries(state.workouts).forEach(([, days]) => {
 let any = false;
 Object.entries(days).forEach(([, records]) => Object.entries(records).forEach(([id, record]) => {
  const done = (record.series || []).filter(seriesItem => seriesItem.done);
  if (!done.length) return;
  any = true;
  series += done.length;
  volume += done.reduce((acc, seriesItem) => acc + (Number(seriesItem.weight) || 0) * (Number(seriesItem.reps) || 0), 0);
  const max = Math.max(...done.map(seriesItem => Number(seriesItem.weight) || 0), 0);
  maxByExercise[id] = Math.max(maxByExercise[id] || 0, max);
 }));
 if (any) workouts++;
});
const records = Object.values(maxByExercise).filter(value => value > 0).length;
return { workouts, series, volume, records, maxByExercise };
}
function drawVolumeChart() {
charts.forEach(chart => chart.destroy());
charts = [];
const keys = Object.keys(state.workouts).sort().slice(-14);
const values = keys.map(date => {
 let total = 0;
 Object.values(state.workouts[date] || {}).forEach(recordsByExercise => {
  Object.values(recordsByExercise).forEach(record => {
   (record.series || []).filter(series => series.done).forEach(series => {
    total += (Number(series.weight) || 0) * (Number(series.reps) || 0);
   });
  });
 });
 return total;
});
charts.push(new Chart(document.getElementById('volumeChart'), {
 type: 'line',
 data: { labels: keys.map(date => date.slice(5)), datasets: [{ label: 'Volume (kg)', data: values, tension: .35 }] },
 options: { responsive: true, plugins: { legend: { display: false } } }
}));
}
function renderExerciseChart() {
const select = document.getElementById('historyExercise');
if (!select) return;
const id = select.value;
const points = [];
Object.keys(state.workouts).sort().forEach(date => {
 Object.entries(state.workouts[date] || {}).forEach(([, records]) => {
  const record = records[id];
  if (!record) return;
  const max = Math.max(...(record.series || []).filter(series => series.done).map(series => Number(series.weight) || 0), 0);
  if (max) points.push([date, max]);
 });
});
const old = charts.pop();
old?.destroy();
charts.push(new Chart(document.getElementById('exerciseChart'), {
 type: 'line',
 data: { labels: points.map(point => point[0].slice(5)), datasets: [{ label: 'Carga máxima (kg)', data: points.map(point => point[1]), tension: .35 }] },
 options: { responsive: true }
}));
}
function renderSettingsPage() {
const app = document.getElementById('app');
app.innerHTML = `<div class="card border-0 shadow-sm mb-3"><div class="card-body"><h4>Configurações</h4><p class="text-muted">As categorias agora são dias da semana.</p><div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" ${state.settings.dark ? 'checked' : ''} onchange="toggleTheme(this.checked)"><label class="form-check-label">Modo escuro</label></div><div class="row g-3"><div class="col-md-4"><label class="form-label">Descanso padrão (s)</label><input id="restPage" type="number" class="form-control" min="0" value="${state.settings.restDefault}" onchange="state.settings.restDefault=Number(this.value)||90;save()"></div><div class="col-md-4"><label class="form-label">Nome para cartão</label><input id="profileNamePage" class="form-control" maxlength="42" value="${esc(state.settings.profileName || '')}" onchange="state.settings.profileName=this.value.trim();save()"></div><div class="col-md-4"><label class="form-label d-block">&nbsp;</label><div class="form-check form-switch"><input id="hideNamePageSwitch" class="form-check-input" type="checkbox" ${state.settings.hideNameOnShare ? 'checked' : ''} onchange="state.settings.hideNameOnShare=this.checked;save()"><label class="form-check-label" for="hideNamePageSwitch">Ocultar nome no compartilhamento</label></div></div></div></div></div>
<div class="card border-0 shadow-sm"><div class="card-body"><h5>Dados</h5><div class="d-grid d-md-flex gap-2"><button class="btn btn-dark" onclick="exportFull()">⬇️ Exportar tudo</button><button class="btn btn-outline-dark" onclick="exportHistory()">⬇️ Histórico</button><button class="btn btn-outline-dark" onclick="exportExercises()">⬇️ Exercícios</button><button class="btn btn-outline-primary" onclick="triggerImport()">⬆️ Importar</button><button class="btn btn-outline-danger" onclick="resetAll()">🗑️ Apagar tudo</button></div></div></div>`;
}
function openSettings() {
document.getElementById('darkModeSwitch').checked = state.settings.dark;
document.getElementById('restDefault').value = state.settings.restDefault;
document.getElementById('profileNameInput').value = state.settings.profileName || '';
document.getElementById('hideNameSwitch').checked = !!state.settings.hideNameOnShare;
new bootstrap.Modal('#settingsModal').show();
}
function toggleTheme(on) {
state.settings.dark = on;
document.body.classList.toggle('dark', on);
save();
}
function openTimer() {
timerSeconds = Number(state.settings.restDefault) || 90;
updateTimerDisplay();
document.getElementById('timerToggle').textContent = 'Iniciar';
timerRunning = false;
new bootstrap.Modal('#timerModal').show();
}
function updateTimerDisplay() {
const minutes = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
const seconds = String(timerSeconds % 60).padStart(2, '0');
document.getElementById('timerDisplay').textContent = `${minutes}:${seconds}`;
}
function adjustTimer(amount) {
timerSeconds = Math.max(0, timerSeconds + amount);
updateTimerDisplay();
}
function toggleTimer() {
if (timerRunning) {
 clearInterval(timerHandle);
 timerRunning = false;
 document.getElementById('timerToggle').textContent = 'Continuar';
 return;
}
timerRunning = true;
document.getElementById('timerToggle').textContent = 'Pausar';
timerHandle = setInterval(() => {
 timerSeconds--;
 updateTimerDisplay();
 if (timerSeconds <= 0) {
  clearInterval(timerHandle);
  timerRunning = false;
  document.getElementById('timerToggle').textContent = 'Iniciar';
  navigator.vibrate?.([200, 100, 200]);
  toast('Descanso terminado!');
 }
}, 1000);
}
function stopTimer() {
clearInterval(timerHandle);
timerRunning = false;
timerSeconds = Number(state.settings.restDefault) || 90;
updateTimerDisplay();
bootstrap.Modal.getInstance(document.getElementById('timerModal'))?.hide();
}
function openSearchExercise() {
renderCatalog();
new bootstrap.Modal('#searchModal').show();
}
function renderCatalog() {
const query = (document.getElementById('searchInput')?.value || '').toLowerCase();
const items = DEFAULT_CATALOG.filter(item => `${item.name} ${item.group}`.toLowerCase().includes(query));
document.getElementById('catalogList').innerHTML = items.map((item, index) => `<div class="list-group-item d-flex align-items-center gap-3"><div class="flex-grow-1"><strong>${item.name}</strong><div class="small-muted">${MUSCLE_GROUPS[item.group].label}</div></div><button class="btn btn-sm btn-dark" onclick="addCatalog(${index})">Adicionar</button></div>`).join('') || '<p class="text-muted">Nenhum resultado.</p>';
}
function addCatalog(index) {
const item = DEFAULT_CATALOG[index];
ensureDay(currentDay);
if (state.exercises[currentDay].some(exercise => exercise.name.toLowerCase() === item.name.toLowerCase())) {
 toast('Esse exercício já está cadastrado neste dia.');
 return;
}
state.exercises[currentDay].push({ id: uid(), name: item.name, image: item.image, group: item.group, sets: 3, reps: 10, weight: 0 });
save();
bootstrap.Modal.getInstance(document.getElementById('searchModal')).hide();
page = 'today';
renderHeader();
renderToday();
toast('Exercício adicionado ao dia selecionado.');
}
function download(filename, object) {
const blob = new Blob([JSON.stringify(object, null, 2)], { type: 'application/json' });
const url = URL.createObjectURL(blob);
const anchor = document.createElement('a');
anchor.href = url;
anchor.download = filename;
anchor.click();
URL.revokeObjectURL(url);
}
function exportFull() {
download(`meu-treino-backup-${todayKey()}.json`, state);
toast('Backup completo exportado.');
}
function exportHistory() {
download(`meu-treino-historico-${todayKey()}.json`, { version: 4, workouts: state.workouts, sessionMeta: state.sessionMeta });
}
function exportExercises() {
download(`meu-treino-exercicios-${todayKey()}.json`, { version: 4, exercises: state.exercises, settings: { profileName: state.settings.profileName, hideNameOnShare: state.settings.hideNameOnShare } });
}
function triggerImport() {
document.getElementById('importInput').click();
}
function importBackup(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = () => {
 try {
  const parsed = JSON.parse(reader.result);
  if (parsed.workouts || parsed.exercises) {
   state = normalizeState(parsed);
  } else {
   throw new Error('invalid');
  }
  save();
  currentDay = state.settings.lastDay;
  renderHeader();
  showToday();
  toast('Dados importados com sucesso.');
 } catch (error) {
  alert('Arquivo JSON inválido ou incompatível.');
 }
};
reader.readAsText(file);
event.target.value = '';
}
function resetAll() {
if (!confirm('Apagar exercícios, histórico e configurações? Esta ação não pode ser desfeita.')) return;
state = freshState();
save();
currentDay = state.settings.lastDay;
document.body.classList.remove('dark');
bootstrap.Modal.getInstance(document.getElementById('settingsModal'))?.hide();
showToday();
toast('Todos os dados foram apagados.');
}
function toast(message) {
const element = document.getElementById('toast');
element.querySelector('.toast-body').textContent = message;
bootstrap.Toast.getOrCreateInstance(element, { delay: 2200 }).show();
}
document.getElementById('restDefault')?.addEventListener('change', event => {
state.settings.restDefault = Number(event.target.value) || 90;
save();
});
document.getElementById('darkModeSwitch')?.addEventListener('change', event => {
state.settings.dark = event.target.checked;
document.body.classList.toggle('dark', event.target.checked);
save();
});
document.getElementById('profileNameInput')?.addEventListener('change', event => {
 state.settings.profileName = event.target.value.trim();
 save();
});
document.getElementById('hideNameSwitch')?.addEventListener('change', event => {
 state.settings.hideNameOnShare = event.target.checked;
 save();
});
document.getElementById('checkoutHideName')?.addEventListener('change', event => {
 checkoutDraft.hideName = event.target.checked;
 renderCheckoutPreviewCard();
});
document.getElementById('checkoutModal')?.addEventListener('hidden.bs.modal', () => {
 if (checkoutDraft.sourceUrl?.startsWith('blob:')) URL.revokeObjectURL(checkoutDraft.sourceUrl);
 checkoutDraft.sourceUrl = '';
 updateCheckoutActionButtons(false);
 document.getElementById('checkoutPreviewWrap').classList.add('d-none');

function boot() {
document.body.classList.toggle('dark', !!state.settings.dark);
currentDay = isDayKey(state.settings.lastDay) ? state.settings.lastDay : dayFromDate(new Date());

 checkoutDraft.hideName = !!state.settings.hideNameOnShare;

}
boot();
